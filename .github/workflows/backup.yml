# 日次 DB バックアップ。docs/infrastructure-spec.md §7/§10 が確定した backup.yml の実装。
# RPO ≤ 24h / RTO ≤ 4h。「復元できないバックアップを成功と数えない」(qa-019) ため、
# export → upload → 検証 → heartbeat の順で、途中で失敗したら heartbeat を打たない。
name: hub-backup

on:
  schedule:
    # 0 17 * * * UTC = JST 2:00 (infrastructure-spec §5)
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: hub-backup
  cancel-in-progress: false

jobs:
  backup:
    name: control-plane export → gzip → R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必要な secret が 1 つでも欠けていたら「成功」にしない (fail-closed)。
      # 設定漏れのまま緑になると、バックアップが無いことに気づけないまま RPO を割る。
      - name: 前提 secret の存在確認
        run: |
          missing=""
          [ -n "${{ secrets.TURSO_DATABASE_URL }}" ] || missing="$missing TURSO_DATABASE_URL"
          [ -n "${{ secrets.TURSO_AUTH_TOKEN }}" ] || missing="$missing TURSO_AUTH_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_R2_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_R2_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "${{ secrets.BACKUP_HEARTBEAT_URL }}" ] || missing="$missing BACKUP_HEARTBEAT_URL"
          if [ -n "$missing" ]; then
            echo "::error::backup に必要な secret が未設定です:$missing"
            echo "投入手順: docs/features/feat-hub-foundation/runbook.md §1"
            echo "台帳 (用途・必須/任意の正本): scripts/ci/actions-secrets-registry.json"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 成果物は restore CLI が読む control-plane export (JSONL) にする。
      # turso db shell の .dump だと SQL になり、§10 の restore drill が実行できない
      # =「復元できないバックアップを成功と数えない」(qa-019) を満たせないため。
      # 副次的に Turso CLI と Platform API token (TURSO_API_TOKEN) への依存も無くなる。
      - name: control-plane export → gzip
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          year="$(date -u +%Y)"
          mkdir -p "$GITHUB_WORKSPACE/backup"
          artifact="$GITHUB_WORKSPACE/backup/${stamp}.jsonl"
          # --filter は cwd を packages/db にするため、--out は必ず絶対パスで渡す。
          pnpm --filter @harness-hub/db exec tsx scripts/export-control-plane.ts \
            --url "$TURSO_DATABASE_URL" --out "$artifact"
          # 成果物の採否は verify-export-artifact へ一本化する (実体は parseExportArtifact)。
          # header の形式・現行 allTables 29 テーブルとの集合一致・header の行数と実際の行数の一致まで
          # fail-closed で見るため、schema が異なる接続先や migration 未適用は必ず落ちる。
          # ここで header を grep したり行数を awk で数えたりすると、ライブラリより弱い検査が
          # 先に判定してしまう。旧実装の「データ行 0 なら失敗」がまさにそれで、migration 済みだが
          # まだ利用の無い本番 DB を 3 夜連続で失敗させていた (空 DB の export も復元可能な正しい断面)。
          pnpm --filter @harness-hub/db exec tsx scripts/verify-export-artifact.ts --file "$artifact"
          gzip -9 "$artifact"
          echo "OBJECT_KEY=db-export/${year}/${stamp}.jsonl.gz" >> "$GITHUB_ENV"
          echo "LOCAL_PATH=${artifact}.gz" >> "$GITHUB_ENV"

      # --file に渡すパスは必ず絶対パスにする。pnpm --filter は wrangler を apps/hub を cwd として
      # 起動するため、相対パスだと apps/hub/backup/... を指してしまい upload も検証も落ちる。
      - name: R2 へ upload (Wrangler)
        env:
          # Wrangler が読む env 名は固定だが、値は Workers deploy 権限を持たない R2 専用 secret から渡す。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm --filter @harness-hub/hub exec wrangler r2 object put \
            "harness-hub-backups/$OBJECT_KEY" --file "$LOCAL_PATH" --remote

      # upload しただけでは「復元できる」ことの根拠にならないため、実体を取り直して byte 単位で照合する
      - name: upload 結果の検証
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          verify_path="$GITHUB_WORKSPACE/backup/verify-${GITHUB_RUN_ID}.jsonl.gz"
          pnpm --filter @harness-hub/hub exec wrangler r2 object get \
            "harness-hub-backups/$OBJECT_KEY" --file "$verify_path" --remote
          cmp "$LOCAL_PATH" "$verify_path"
          echo "upload 後に再取得した backup は元ファイルと一致しました"

      # 全て成功したときだけ heartbeat を打つ。「cron が動かなかった」と
      # 「動いたが失敗した」の両方を外形監視側で検知させる (qa-027)。
      - name: heartbeat 通知
        if: success()
        run: |
          curl -fsS -m 10 "${{ secrets.BACKUP_HEARTBEAT_URL }}"
