# 日次 DB バックアップ。docs/infrastructure-spec.md §7/§10 が確定した backup.yml の実装。
# RPO ≤ 24h / RTO ≤ 4h。「復元できないバックアップを成功と数えない」(qa-019) ため、
# export → upload → 検証 → heartbeat の順で、途中で失敗したら heartbeat を打たない。
name: hub-backup

on:
  schedule:
    # 0 17 * * * UTC = JST 2:00 (infrastructure-spec §5)
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency:
  group: hub-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Turso dump → gzip → R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 必要な secret が 1 つでも欠けていたら「成功」にしない (fail-closed)。
      # 設定漏れのまま緑になると、バックアップが無いことに気づけないまま RPO を割る。
      - name: 前提 secret の存在確認
        run: |
          missing=""
          [ -n "${{ secrets.TURSO_API_TOKEN }}" ] || missing="$missing TURSO_API_TOKEN"
          [ -n "${{ secrets.TURSO_DATABASE_NAME }}" ] || missing="$missing TURSO_DATABASE_NAME"
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::backup に必要な secret が未設定です:$missing"
            echo "docs/features/feat-hub-foundation/runbook.md §1 の手順で設定してください"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Turso CLI の導入
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> "$GITHUB_PATH"

      - name: DB dump → gzip
        env:
          # turso db shell は DB 接続 token ではなく Turso Platform API token を使う。
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          year="$(date -u +%Y)"
          mkdir -p backup
          turso db shell "${{ secrets.TURSO_DATABASE_NAME }}" ".dump" > "backup/${stamp}.sql"
          # 空 dump を成功にしない (DB 接続だけ成功して中身が取れないケースを弾く)
          bytes=$(wc -c < "backup/${stamp}.sql")
          echo "dump size: ${bytes} bytes"
          if [ "$bytes" -lt 100 ]; then
            echo "::error::dump が異常に小さい (${bytes} bytes)。バックアップとして採用しない"
            exit 1
          fi
          gzip -9 "backup/${stamp}.sql"
          echo "OBJECT_KEY=db-export/${year}/${stamp}.sql.gz" >> "$GITHUB_ENV"
          echo "LOCAL_PATH=backup/${stamp}.sql.gz" >> "$GITHUB_ENV"

      - name: R2 へ upload (Wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm --filter @harness-hub/hub exec wrangler r2 object put \
            "harness-hub-backups/$OBJECT_KEY" --file "$LOCAL_PATH" --remote

      # upload しただけでは「復元できる」ことの根拠にならないため、実体を取り直して byte 単位で照合する
      - name: upload 結果の検証
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          verify_path="backup/verify-${GITHUB_RUN_ID}.sql.gz"
          pnpm --filter @harness-hub/hub exec wrangler r2 object get \
            "harness-hub-backups/$OBJECT_KEY" --file "$verify_path" --remote
          cmp "$LOCAL_PATH" "$verify_path"
          echo "upload 後に再取得した backup は元ファイルと一致しました"

      # 全て成功したときだけ heartbeat を打つ。「cron が動かなかった」と
      # 「動いたが失敗した」の両方を外形監視側で検知させる (qa-027)。
      - name: heartbeat 通知
        if: success()
        run: |
          if [ -z "${{ secrets.BACKUP_HEARTBEAT_URL }}" ]; then
            echo "::warning::BACKUP_HEARTBEAT_URL 未設定のため heartbeat を送出していません (cron 失敗検知が効きません)"
            exit 0
          fi
          curl -fsS -m 10 "${{ secrets.BACKUP_HEARTBEAT_URL }}"
