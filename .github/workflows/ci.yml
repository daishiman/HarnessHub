# Hub 基盤 CI/CD。docs/shared-layers.md §3 の CI 品質ゲートと wrangler デプロイを実装する。
# 設計正本: docs/features/feat-hub-foundation/architecture-decision-record.md §6
# 受入基準: A1 (test→deploy 完走) / A2 (bundle 3MiB) / A4 (共通層の単一実装 owner)
#
# 実行順は「静的検査 → build → test → bundle 予算 → deploy」。deploy は全ゲート通過後にのみ走る。
#
# deploy が要求する repository 設定。GitHub Actions は未設定の secret/variable を
# エラーにせず空文字で渡すため、設定漏れは「認証情報が無い」ではなく「認証に失敗した」形で
# deploy の途中に現れる。どの値が要るかをここで読めるようにしておく。
#   secrets.CLOUDFLARE_API_TOKEN   Workers deploy / rollback 用。R2 write 権限を含めない
#   secrets.CLOUDFLARE_R2_API_TOKEN 本番 smoke の R2 往復用。Workers Scripts 権限を含めない
#   secrets.CLOUDFLARE_ACCOUNT_ID  デプロイ先アカウント
#   secrets.TURSO_DATABASE_URL      migration / 本番 smoke の接続先 URL
#   secrets.TURSO_AUTH_TOKEN        migration / 本番 smoke の DB 認証トークン
#   vars.HUB_HEALTH_URL            デプロイ後の /health 疎通確認先 (未設定なら疎通確認が exit 1)
#   vars.HUB_PUBLIC_URL            デプロイ後の OIDC start-flow smoke の公開 origin
name: hub-ci

on:
  push:
    branches: ["main", "devgraph/**", "feat/**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/ci/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      # backup.yml など ci.yml 以外を壊しても検査が走るよう workflow 全体を対象にする
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/ci/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      # backup.yml など ci.yml 以外を壊しても検査が走るよう workflow 全体を対象にする
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ゲート 1: 静的検査。依存インストール前に走らせ、npm 混入・共通層の重複実装・
  # 認証構造違反・Actions secret/variable 台帳の乖離を最速で落とす
  static-gates:
    name: 静的ゲート (pnpm / duplicate detector / auth / secret 台帳突合)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: pnpm 混入検査 (quality_constraint pnpm-only-no-npm)
        run: node scripts/ci/check-pnpm-only.mjs --json artifacts/pnpm-only.json
      - name: 共通層 duplicate detector = 0 件 (A4)
        run: |
          node scripts/ci/check-shared-layer-duplicates.mjs \
            --json artifacts/duplicate-scan.json \
            --report artifacts/shared-layer-ownership.json
      # G12: feat-auth-tenancy が追加した 3 つの静的検査 (Auth.js 境界隔離 / 認可判定の単一集約 /
      # dev 専用 provider の非存在) を束ね役経由で呼ぶ。1 本でも fail すれば非ゼロ終了する。
      # 依存インストール不要 (node のみ) のため静的ゲート段に置き、最速で落とす。
      # local 側の同一入口は root の `pnpm check:auth` (ADR §6 R-18 / qa-039【2】)。
      - name: G12 認証・認可 静的検査 (auth gates 3 種 / qa-020, SEC2, D3)
        run: |
          node scripts/ci/check-required-package-script.mjs apps/hub/package.json check:auth-gates
          node apps/hub/scripts/check-auth-gates.mjs --json artifacts/auth-gates.json
      # feat-publish-pipeline P08/P09: test が green でも公開経路から secret scan の合成が
      # 外れたり、Hub が packages/db の schema 内部へ直接依存したりする退行を静的に遮断する。
      - name: G15 publish pipeline 境界・検査結線ゲート (I2 / qa-006 / owner 境界)
        run: |
          node apps/hub/scripts/check-publish-inspection-gate.mjs \
            --json artifacts/publish-inspection-gate.json
          node apps/hub/scripts/check-db-schema-boundary.mjs \
            --json artifacts/publish-db-schema-boundary.json
      - name: G15 detector 実効性 (意図的な検査 bypass / DB subpath を拒否)
        run: node apps/hub/scripts/check-publish-boundary-gates.mjs
      - name: detector 実効性の検証 (HF-A4-DUP-002 / 意図的違反を検出できること)
        run: |
          set +e
          node scripts/ci/check-shared-layer-duplicates.mjs --include-fixtures --root apps/hub/tests/fixtures/duplicate-violation > /dev/null 2>&1
          code=$?
          set -e
          if [ -d apps/hub/tests/fixtures/duplicate-violation ] && [ "$code" -eq 0 ]; then
            echo "detector が意図的違反を検出できていません (ゲートの故障)"; exit 1
          fi
          echo "detector 実効性チェック完了 (exit=$code)"
      # workflow が要求する secret / variable と台帳 (actions-secrets-registry.json) の乖離を落とす。
      # 散文の台帳は書いた翌日には腐るので、突合そのものをゲートにする (HarnessHub-fnzl)。
      # ここでは --live を付けない。実投入状況の確認は gh 認証が要るため runbook §1 2-d の手動運用。
      - name: Actions secret / variable 台帳の突合
        run: node scripts/ci/check-actions-secrets.mjs --json artifacts/actions-secrets.json
      # 同じ思想を Cloudflare 側へ。ここは --live を付けず、台帳と wrangler.jsonc の宣言のズレだけを
      # PR 時点で落とす (実投入の確認は Cloudflare 認証が要るため deploy job 側で --live を実行する)。
      - name: Worker secret 台帳と wrangler 宣言の突合
        run: node scripts/ci/check-worker-secrets.mjs --json artifacts/worker-secrets.json
      - uses: actions/upload-artifact@v4
        with:
          name: static-gate-evidence
          path: artifacts/
          if-no-files-found: warn

  test:
    name: build & test (G2-G9 required status checks)
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      # G1(正本機構): corepack で pnpm を pin する (qa-003 / qa-038【2】/ qa-039【1】)
      - name: enable corepack (pnpm pin)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # G2 の実体は Biome (lint + format)。以前は tsc --noEmit のエイリアスで
      # G3 typecheck と同一検査になっており lint/format が実質存在しなかった (P10 指摘 F-09)。
      - name: G2 lint / format (Biome)
        run: pnpm exec biome ci
      - name: G3 typecheck
        run: pnpm -r typecheck
      - name: build
        run: pnpm -r build
      # bundle contract test も実 bundle を検査できるよう、G4 より前に Worker 成果物を生成する。
      # 以前は G4 後の生成だったため HF-A2-BUNDLE-001 が CI で常時 skip されていた (P10 F-15)。
      - name: Worker 成果物の生成 (bundle test / 計測の前提)
        run: pnpm --filter @harness-hub/hub run build:worker
      - name: G4 unit / integration / contract test (Tenant 分離・検査 pipeline 挙動同値を含む)
        run: pnpm -r test
      # G4 の名指し部分。qa-038【2】は tenant 分離テストを必須ゲートとして名指ししているが、
      # `pnpm -r test` に含まれているだけでは、ファイル分割や it.skip で 1 件も実行されなくなっても
      # 緑のまま通る。対象の実在とケースの無効化を静的に確かめてから、名指しで実行する。
      # ゲート数は増えない (G4 の内訳を明示するだけ) ため qa-038【2】の「8 種」の数え方は変わらない。
      - name: G4 名指し tenant 分離テスト (SEC3 / D4 row-level-scope / apps/hub)
        run: |
          node scripts/ci/check-tenant-isolation-gate.mjs --json artifacts/tenant-isolation-gate.json
          node scripts/ci/check-required-package-script.mjs apps/hub/package.json test:tenant-isolation
          pnpm --filter @harness-hub/hub run test:tenant-isolation
      # G4 全体に含まれるだけでは test の移動・skip で契約が無言で消え得る。Google OIDC の
      # start-flow と「owner は DB role ではなく資源との関係から合成する」認可表を名指しで再実行する。
      - name: G14 OIDC / owner authorization contract
        run: |
          node scripts/ci/check-required-package-script.mjs apps/hub/package.json test:auth-release-contract
          pnpm --filter @harness-hub/hub run test:auth-release-contract
      - name: G6 secret scan (packages/inspection を CI からも呼ぶ / qa-038【2】)
        run: |
          node scripts/ci/check-required-package-script.mjs packages/inspection/package.json scan:secrets
          pnpm --filter @harness-hub/inspection run scan:secrets
      - name: G7 破壊的 DDL 検査 (expand/contract 3 段階 / qa-038【5】)
        run: |
          if [ -d packages/db/migrations ]; then
            node scripts/ci/check-required-package-script.mjs packages/db/package.json check:ddl
            pnpm --filter @harness-hub/db run check:ddl
          else
            echo "migrations 未作成 (feat-domain-model-db 未着手) のため対象なし"
          fi
      # feat-domain-model-db P09 の静的ゲート。動的ゲート (migration apply = DMDB-T13 / tenant 分離 = DMDB-T03 /
      # export 完全性・別 DB restore round-trip = DMDB-T06/T12) は G4 の `pnpm -r test` 内で packages/db が実行する。
      - name: G7b テナント分離網羅 + 接続層隔離 (D4 §8.4 / qa-020)
        run: |
          node scripts/ci/check-required-package-script.mjs packages/db/package.json check:tenant-isolation-coverage
          pnpm --filter @harness-hub/db run check:tenant-isolation-coverage
          node scripts/ci/check-required-package-script.mjs packages/db/package.json check:connection-isolation
          pnpm --filter @harness-hub/db run check:connection-isolation
      - name: G8 OpenAPI / zod drift 検査
        run: |
          node scripts/ci/check-required-package-script.mjs packages/schemas/package.json check:drift
          pnpm --filter @harness-hub/schemas run check:drift
      - name: G9 axe a11y (部品単体 + 画面結合の 2 段)
        run: pnpm --filter @harness-hub/ui run test:a11y && pnpm --filter @harness-hub/hub run test:a11y
      - name: G5 bundle 予算 (Worker gzip 後 3MiB / A2)
        run: pnpm --filter @harness-hub/hub run check:bundle
      # G5 が測るのは Cloudflare へ上げる Worker (サーバー側) であって、ブラウザへ配る client JS ではない。
      # 実測 (HarnessHub-aqi): / の First Load JS が 159 KiB へ膨らみ TBT 926ms を出したとき、
      # G5 は 0.96MiB / 3MiB で緑のままだった。TBT/INP を守るには client 側の予算が別に要る。
      - name: G13 client JS 予算 (route ごと First Load JS gzip 後 120KiB / qa-018)
        run: |
          node scripts/ci/check-required-package-script.mjs apps/hub/package.json check:client-bundle
          pnpm --filter @harness-hub/hub run check:client-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            artifacts/
            apps/hub/artifacts/
          if-no-files-found: warn

  # ゲート最終: deploy。static-gates と test の両方が success したときだけ実行される (A1 の "test→deploy 完走")。
  # main push が通常経路。workflow_dispatch は docs-only merge などで path filter が発火しなかった場合に、
  # main の同一 commit を正規 CI 経路で再配備する明示的な再実行経路であり、feature branch では許可しない。
  deploy:
    name: wrangler deploy (Cloudflare Workers)
    runs-on: ubuntu-latest
    needs: [static-gates, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # GitHub Actions は未登録の secret / variable を空文字にする。migration や deploy を始めてから
      # 欠落へ気付くと、本番を前進させた後に失敗するため、依存する設定を最初に名前だけ検査する。
      - name: production deploy preflight (required secrets / variables)
        id: preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          HUB_HEALTH_URL: ${{ vars.HUB_HEALTH_URL }}
          HUB_PUBLIC_URL: ${{ vars.HUB_PUBLIC_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_R2_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            TURSO_DATABASE_URL TURSO_AUTH_TOKEN HUB_HEALTH_URL HUB_PUBLIC_URL; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::production deploy の必須設定が未登録です: ${missing[*]}"
            exit 1
          fi
          echo "production deploy preflight: required settings are present"
      # HarnessHub-o2i.13 (2026-08-02): 上の preflight は **GitHub 側**の設定しか見ない。Worker 自身が読む
      # Cloudflare Secret は別の入れ物で、`AUTH_ACCESS_TOKEN_SECRET` が未投入のまま本番が稼働していた。
      # wrangler.jsonc は同名を secrets.required に宣言し、テストもその**宣言**を検査していたが、
      # 「宣言した secret が実際に入っているか」は誰も見ていなかった。その非対称をここで埋める。
      # deploy より前に置くので、失敗しても本番は古い版のまま動き続ける (fail-closed で安全側)。
      - name: 本番 Worker secret の実投入検査 (台帳 ↔ wrangler 宣言 ↔ 実投入)
        id: worker_secrets
        run: node scripts/ci/check-worker-secrets.mjs --live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # qa-038【5】: 常設 staging を置かず、deploy 直前に CI が production Turso へ migration を適用する
      # (手動適用は採らない)。Worker が先に出ると新コードが未作成の表を参照して落ちるため、順序は
      # 「migration → deploy」で固定する。secret 欠落は「適用していないのに成功」を意味するので中止する。
      - name: production migration 適用 (drizzle / qa-038【5】)
        id: migrate
        run: |
          set -e
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "TURSO_DATABASE_URL / TURSO_AUTH_TOKEN が未設定です。migration 未適用のまま deploy しないため中止します"
            exit 1
          fi
          pnpm --filter @harness-hub/db exec tsx scripts/migrate-deploy.ts --url "$TURSO_DATABASE_URL" --dry-run
          pnpm --filter @harness-hub/db exec tsx scripts/migrate-deploy.ts --url "$TURSO_DATABASE_URL"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: opennext build
        run: pnpm --filter @harness-hub/hub run build:worker
      - name: wrangler deploy
        id: deploy
        # Cloudflare Workers は「version (アップロードされた版)」と「deployment (実際に配信される版)」が
        # 別概念で、deploy が成功しても配信が入れ替わらない状態が成立し得る。後段の一致検査へ渡すため、
        # 今アップロードした version id を出力へ控える (表示はそのまま残す)。
        run: |
          set -euo pipefail
          pnpm --filter @harness-hub/hub exec wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          version="$(grep -oE 'Current Version ID: [0-9a-fA-F-]+' /tmp/wrangler-deploy.log | tail -1 | awk '{print $NF}')"
          if [ -z "$version" ]; then
            echo "::error::wrangler deploy の出力から Current Version ID を取得できなかった。配信版の一致検査ができないため中止する"
            exit 1
          fi
          echo "deployed_version=$version" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: デプロイ後 /health 疎通確認 (A3)
        id: health
        run: |
          set -e
          url="${{ vars.HUB_HEALTH_URL }}"
          if [ -z "$url" ]; then echo "HUB_HEALTH_URL 未設定のため疎通確認をスキップできません"; exit 1; fi
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$url")
          echo "health: $code"; cat /tmp/health.json
          [ "$code" = "200" ]
      # 2026-08-07 に実際に踏んだ欠落を埋める step。deploy は 2 run 連続で success を返していたのに、
      # 配信されていたのは 8/4 の失敗時 rollback で固定された古い version (2e4a6c5b) のままだった。
      # 直後の smoke は古いコードを検査するので、修正済みの契約 (tenant_mismatch=404) が直っていないように見え、
      # その失敗でまた rollback が走って古い版の固定が強まる、という悪循環になっていた。
      # /health は CF_VERSION_METADATA から「いま実行されている version」を返すので、判定材料は最初から
      # 応答に載っていた。deploy した版と突き合わせていなかっただけなので、ここで fail-closed にする。
      - name: 配信版が今デプロイした版であることの検査 (deploy 成功 ≠ 配信更新)
        id: version_gate
        env:
          DEPLOYED_VERSION: ${{ steps.deploy.outputs.deployed_version }}
          HEALTH_URL: ${{ vars.HUB_HEALTH_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 伝播には数秒かかる。「まだ伝播していない」と「そもそも昇格していない」を取り違えないよう、
          # 一定時間は再試行してから落とす。
          #
          # 一致は 1 回では足りない。Cloudflare は colo (エッジ拠点) ごとに切替タイミングが違うので、
          # 単発の一致で通すと、直後の smoke が別 colo の旧版へ当たる窓が残る。2026-08-07 の run
          # 31221676748 で実際に起きた: /health は 1.3 秒後に新版へ切替わってゲートは通ったのに、
          # 続く hearing smoke は修正前のコード (tenant_mismatch=403) を叩いて落ちた。
          # そのため VERSION_GATE_STREAK 回「連続で」一致することを通過条件にする。
          # 判定材料は /health の JSON だけに寄せる。wrangler の一覧出力は表示仕様が変わりうるため、
          # 通過判定には使わず診断表示に留める (パース失敗が空文字になって素通りするのを避ける)。
          required_streak="${VERSION_GATE_STREAK:-3}"
          interval="${VERSION_GATE_INTERVAL_SECONDS:-3}"
          timeout_seconds="${VERSION_GATE_TIMEOUT_SECONDS:-90}"
          deadline=$(( SECONDS + timeout_seconds ))
          streak=0
          attempt=0
          served=""
          observed_colos=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            headers="/tmp/version-gate-headers.txt"
            # cache-buster と no-cache で、途中のキャッシュされた応答を「配信中の版」と誤認しない
            served="$(curl -sf -D "$headers" -H 'Cache-Control: no-cache' "${HEALTH_URL}?_version_gate=${attempt}" | jq -r '.version // ""' || true)"
            # cf-ray の末尾が応答した colo。どの拠点を何回観測したうえで通したかを後から検証できるようにする
            colo="$(grep -i '^cf-ray:' "$headers" 2>/dev/null | tr -d '\r' | awk -F'-' '{print $NF}' || true)"
            case " $observed_colos " in
              *" ${colo:-unknown} "*) ;;
              *) observed_colos="${observed_colos} ${colo:-unknown}" ;;
            esac
            if [ "$served" = "$DEPLOYED_VERSION" ]; then
              streak=$(( streak + 1 ))
            else
              streak=0
            fi
            echo "attempt=${attempt} colo=${colo:-unknown} served=${served:-none} streak=${streak}/${required_streak}"
            if [ "$streak" -ge "$required_streak" ]; then break; fi
            sleep "$interval"
          done
          echo "deployed=${DEPLOYED_VERSION} served=${served} streak=${streak}/${required_streak} colos=${observed_colos# }"
          if [ "$streak" -lt "$required_streak" ]; then
            echo "::error::配信版が ${timeout_seconds} 秒以内に ${required_streak} 回連続で一致しなかった (deployed=${DEPLOYED_VERSION} served=${served})。以降の smoke は古いコードを検査することになるため中止する"
            echo "--- 診断: 現在の deployment / version 一覧 ---"
            pnpm --filter @harness-hub/hub exec wrangler deployments list || true
            pnpm --filter @harness-hub/hub exec wrangler versions list || true
            exit 1
          fi
      # Google 資格情報を CI に保存せず、tenant provider → CSRF → native form POST →
      # Google authorization redirect (state / nonce / PKCE) までを本番 URL で確認する。
      - name: 本番 OIDC start-flow smoke (tenant / CSRF / Google redirect)
        id: oidc_smoke
        run: |
          node apps/hub/scripts/smoke-production-oidc.mjs \
            --origin "$HUB_PUBLIC_URL" --tenant harness-hub
        env:
          HUB_PUBLIC_URL: ${{ vars.HUB_PUBLIC_URL }}
      # P13 スモークテスト 6 項目 (DB 接続 / ULID PK / releases immutable / R2 put-get /
      # audit hash chain / 日次 export dry-run) を毎デプロイ再実行する。専用テナントは検査後に自動削除される。
      - name: 本番 DB / R2 スモークテスト (P13 受入条件 6 項目)
        id: smoke
        run: |
          pnpm --filter @harness-hub/db exec tsx scripts/smoke-production.ts \
            --url "$TURSO_DATABASE_URL" --r2-bucket harness-hub-packages
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # feat-hearing-intake P13 の実データ E2E と SEC8 本番挙動 (release-notes §7.1 の残 2 件)。
      # 提出は session-only のため route と同じ server code を本番 DB へ実行し、pull / complete は
      # Device Flow で得た本物の access token で本番 Worker の HTTP を通す。**新しい secret を要求しない**
      # のが前提で、使う値は既に台帳にある TURSO_* と HUB_PUBLIC_URL だけ。使い捨て tenant は自動削除される。
      - name: 本番 hearing 実データ E2E / SEC8 スモークテスト (P13 受入条件)
        id: hearing_smoke
        run: pnpm --filter @harness-hub/hub run smoke:hearing-production
        env:
          HUB_PUBLIC_URL: ${{ vars.HUB_PUBLIC_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # deploy 以降のいずれかが失敗したときの復旧手順。方針は 3 点:
      #   1. DB は自動で戻さない。migration は expand-only (CREATE TABLE のみ) で、巻き戻すと実データを失う。
      #      旧 Worker は新規テーブルを参照しないため、DB を前進させたままでも本番は整合する。
      #   2. Worker は「壊れた新 version が本番に出ている」ときだけ直前 version へ戻す。
      #      migration 失敗や deploy 自体の失敗では新 version が出ていないので、戻す対象が無い。
      #   3. この step の exit code は「ロールバックの成否」を表す。元の失敗は前段 step が既に赤にしており、
      #      job は failure のまま残る。ここを無条件に赤くすると「復旧も失敗した」と誤読されるため行わない。
      - name: 失敗時ロールバック
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          VERSION_GATE_OUTCOME: ${{ steps.version_gate.outcome }}
          OIDC_SMOKE_OUTCOME: ${{ steps.oidc_smoke.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          HEARING_SMOKE_OUTCOME: ${{ steps.hearing_smoke.outcome }}
        run: |
          set -euo pipefail
          echo "preflight=${PREFLIGHT_OUTCOME} migrate=${MIGRATE_OUTCOME} deploy=${DEPLOY_OUTCOME} health=${HEALTH_OUTCOME} version_gate=${VERSION_GATE_OUTCOME} oidc_smoke=${OIDC_SMOKE_OUTCOME} data_smoke=${SMOKE_OUTCOME} hearing_smoke=${HEARING_SMOKE_OUTCOME}"
          echo "DB migration は expand-only のため自動では巻き戻さない (巻き戻しは実データ喪失を伴う手動判断)"
          if [ "${DEPLOY_OUTCOME}" != "success" ]; then
            echo "wrangler deploy が未成功 (${DEPLOY_OUTCOME}) = 本番は旧 Worker のまま。戻す対象なし"
            exit 0
          fi
          # 配信版が入れ替わっていないなら、本番に出ているのは元から旧版であって「壊れた新 version」ではない。
          # ここで rollback を打つと、未昇格の原因である古い版への固定をこちらから強めてしまう (2026-08-07 の実例)。
          if [ "${VERSION_GATE_OUTCOME}" != "success" ]; then
            echo "配信版が今デプロイした版に入れ替わっていない (version_gate=${VERSION_GATE_OUTCOME}) = 本番は旧 Worker のまま。戻す対象なし"
            exit 0
          fi
          echo "::warning::post-deploy 検証が失敗したため Worker を直前 version へ戻す"
          if ! pnpm --filter @harness-hub/hub exec wrangler rollback \
            --message "hub-ci run ${GITHUB_RUN_ID}: post-deploy 検証失敗による自動復帰" -y; then
            echo "::error::wrangler rollback に失敗した。壊れた version が本番に残っている。手動で rollback すること"
            exit 1
          fi
          echo "Worker を直前 version へ戻した。DB は前進したまま (expand-only のため旧 Worker と互換)"
