# G11 Core Web Vitals 定期計測。quality_constraint `cwv-good` (qa-018(2)) の計測経路。
# 設計正本: docs/features/feat-hub-foundation/architecture-decision-record.md §6
#
# PR 単位ではなく main 反映後の定期計測にしている理由: PR ごとの Lighthouse 実行は
# GitHub Actions 無料枠 2,000 分/月 (infrastructure-spec §11) を圧迫し C2 に反するため。
# bundle 予算 (G5) は代理指標であり good 判定の根拠にならないので、実測経路を別に持つ。
name: hub-cwv

on:
  schedule:
    # 週次 (JST 月曜 10:00)。デプロイ直後の一時的な劣化ではなく定常状態を測る
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse (LCP / INP / CLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 計測対象・scope・専用 secret のどれかが無い状態を「good」と誤判定しないため fail-closed にする。
      # target URL を手入力にすると短命 ticket を任意 origin へ送れるので、HUB_PUBLIC_URL の /catalog に固定する。
      - name: CWV 専用 credential の前提確認と target の発行
        env:
          HUB_PUBLIC_URL: ${{ vars.HUB_PUBLIC_URL }}
          HUB_CWV_PROBE_SECRET: ${{ secrets.HUB_CWV_PROBE_SECRET }}
          HUB_CWV_PROBE_TENANT_ID: ${{ secrets.HUB_CWV_PROBE_TENANT_ID }}
          HUB_CWV_PROBE_WORKSPACE_ID: ${{ secrets.HUB_CWV_PROBE_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in HUB_PUBLIC_URL HUB_CWV_PROBE_SECRET HUB_CWV_PROBE_TENANT_ID HUB_CWV_PROBE_WORKSPACE_ID; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::CWV 計測の必須設定が未投入です:$missing"
            echo "未計測を good と見なさないため、secret/variable 名だけを示して停止します"
            exit 1
          fi
          node apps/hub/scripts/mint-cwv-probe.mjs --github-env "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lighthouse 実行
        run: |
          set -euo pipefail
          npx --yes lighthouse "$TARGET_URL" \
            --output=json --output-path=./lighthouse.json \
            --only-categories=performance \
            --chrome-flags="--headless --no-sandbox" \
            --quiet

      - name: Lighthouse artifact から短命 ticket を除去
        run: |
          set -euo pipefail
          node apps/hub/scripts/sanitize-cwv-artifact.mjs ./lighthouse.json "$CWV_PROBE_TICKET"

      # qa-018(2) の閾値: LCP ≤ 2.5s / INP ≤ 200ms / CLS ≤ 0.1。
      # 1 つでも外れたら fail させる (警告どまりにすると劣化が放置される)。
      - name: CWV 閾値判定
        run: |
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync("./lighthouse.json", "utf8"));
            const a = r.audits ?? {};
            const metrics = {
              LCP: { value: a["largest-contentful-paint"]?.numericValue, budget: 2500, unit: "ms" },
              CLS: { value: a["cumulative-layout-shift"]?.numericValue, budget: 0.1, unit: "" },
              TBT: { value: a["total-blocking-time"]?.numericValue, budget: 200, unit: "ms (INP の lab 代理指標)" },
            };
            let failed = false;
            for (const [name, m] of Object.entries(metrics)) {
              if (typeof m.value !== "number") {
                console.error(`::error::${name} を取得できませんでした (計測失敗を good と見なさない)`);
                failed = true;
                continue;
              }
              const ok = m.value <= m.budget;
              console.log(`${name}: ${m.value.toFixed(2)} / 予算 ${m.budget} ${m.unit} → ${ok ? "OK" : "NG"}`);
              if (!ok) failed = true;
            }
            fs.writeFileSync("./cwv-report.json", JSON.stringify({ url: process.env.SAFE_TARGET_URL, metrics }, null, 2));
            if (failed) { console.error("::error::Core Web Vitals が good 圏を外れています (qa-018)"); process.exit(1); }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: cwv-evidence
          path: |
            lighthouse.json
            cwv-report.json
